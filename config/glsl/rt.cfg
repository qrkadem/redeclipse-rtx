// ray tracing inputs (vkrt.cpp), made from the G-buffer: world positions, w 0 where nothing was drawn, and normals

lazyshader $SHADER_DEFAULT "rtinputs" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    @(gfetchdefs [tex0 tex1])
    uniform mat4 worldmat;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragpos;
    fragdata(1) vec4 fragnormal;
    void main(void)
    {
        @(gdepthunpack depth [gfetch(tex0, texcoord0)] [
            vec4 pos = worldmat * vec4(depth*texcoord0, depth, 1.0);
        ] [
            vec4 pos = worldmat * vec4(texcoord0, depth, 1.0);
        ])
        vec3 normal = gfetch(tex1, texcoord0).xyz*2.0 - 1.0;
        float len = dot(normal, normal);
        fragpos = vec4(pos.xyz/pos.w, len > 0.01 ? 1.0 : 0.0);
        fragnormal = vec4(normal * inversesqrt(max(len, 1e-6)), 0.0);
    }
]

// the first person model is drawn with its own projection, so it stays out of the traced surfaces
lazyshader $SHADER_DEFAULT "rtclearavatar" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    fragdata(0) vec4 fragpos;
    void main(void)
    {
        fragpos = vec4(0.0);
    }
]
