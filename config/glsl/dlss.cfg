// DLSS frame generation inputs, made from the G-buffer: per pixel motion to where it was the frame before, in pixels,
// and depth as the depth buffer holds it

lazyshader $SHADER_DEFAULT "dlssgvectors" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    @(gfetchdefs tex0)
    uniform sampler2DRect tex1;
    uniform mat4 curmatrix, prevmatrix;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragmotion;
    fragdata(1) vec4 fragdepth;
    void main(void)
    {
        @(gdepthunpack depth [gfetch(tex0, texcoord0)] [
            vec4 pos = vec4(depth*texcoord0, depth, 1.0);
        ] [
            vec4 pos = vec4(texcoord0, depth, 1.0);
        ])
        vec4 cur = curmatrix * pos;
        vec4 prev = prevmatrix * pos;
        // models wrote their own motion, everything else moves only with the camera
        vec4 velocity = texture2DRect(tex1, texcoord0);
        fragmotion = vec4(velocity.z > 0.5 ? velocity.xy : prev.xy/prev.w - cur.xy/cur.w, 0.0, 0.0);
        fragdepth = vec4(clamp(cur.z/cur.w, 0.0, 1.0));
    }
]

// the first person model moves with the camera, so it holds still on screen
lazyshader $SHADER_DEFAULT "dlssgstill" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    fragdata(0) vec4 fragmotion;
    void main(void)
    {
        fragmotion = vec4(0.0);
    }
]

// DLSS ray reconstruction guides, made from the G-buffer the way the deferred shading reads it: the diffuse albedo
// (none on metal), the specular albedo (the split sum environment BRDF the reflections use), and the normal with the
// roughness in w
lazyshader $SHADER_DEFAULT "dlssrrguides" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    @(gfetchdefs [tex0 tex1 tex3])
    uniform mat4 worldmat;
    uniform vec3 camera;
    uniform vec4 pbrparams;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragdiffuse;
    fragdata(1) vec4 fragspecular;
    fragdata(2) vec4 fragnormal;

    vec2 envbrdf(float roughness, float ndotv)
    {
        vec4 r = roughness*vec4(-1.0, -0.0275, -0.572, 0.022) + vec4(1.0, 0.0425, 1.04, -0.04);
        float a004 = min(r.x*r.x, exp2(-9.28*ndotv))*r.x + r.y;
        return vec2(-1.04, 1.04)*a004 + r.zw;
    }

    void main(void)
    {
        vec4 normal = gfetch(tex1, texcoord0);
        if(normal.x + normal.y == 0.0)
        {
            // the sky: nothing to demodulate
            fragdiffuse = vec4(0.0);
            fragspecular = vec4(0.0);
            fragnormal = vec4(0.0, 0.0, 1.0, 1.0);
            return;
        }
        normal.xyz = normalize(normal.xyz*2.0 - 1.0);
        vec4 diffuse = gfetch(tex0, texcoord0);
        @(gdepthunpack depth [gfetch(tex3, texcoord0)] [
            vec4 pos = worldmat * vec4(depth*texcoord0, depth, 1.0);
        ] [
            vec4 pos = worldmat * vec4(texcoord0, depth, 1.0);
        ])
        vec3 camdir = normalize(camera - pos.xyz/pos.w);
        float ndotv = clamp(dot(normal.xyz, camdir), 1.0e-4, 1.0);
        float roughness = min(diffuse.a, 1.0 - diffuse.a) * (255.0/127.0), metal = step(0.5, diffuse.a);
        vec3 speccolor = mix(vec3(pbrparams.x), diffuse.rgb, metal);
        vec2 brdf = envbrdf(roughness, ndotv);
        fragdiffuse = vec4(diffuse.rgb*(1.0 - metal), 1.0);
        fragspecular = vec4(speccolor*brdf.x + brdf.y, 1.0);
        fragnormal = vec4(normal.xyz, roughness);
    }
]
