// Physically based replacements for the most used legacy surfaces, see readme.txt for where they're from.
// A map slot using one of the listed diffuse textures gets the replacement's textures and shader instead, keeping its
// placement, colour and grass. texreplacements 0 turns them off from the next map loaded.

// 1:material 2:size it repeats over, in texels of 8 a unit, at about 11.3 units a metre 3:parallax depth, in repeats
// 4:texture commands for the diffuse, like a <mad> matching the brightness of the variant it replaces
pbrslot = [
    setshader bumppbrparallaxworld
    setshaderparam parallaxscale $arg3 (*f $arg3 -0.5)
    texture 0 (concatword $arg4 "<texgen:" $arg2 ">pbr/" $arg1 "/diffuse.jpg")
    texture n (concatword "pbr/" $arg1 "/normal.jpg")
    texture z (concatword "pbr/" $arg1 "/height.png")
    texture m (concatword "pbr/" $arg1 "/arm.jpg")
]

// heights for the normal maps that have none, see tools/normal_to_height.py; off unless autoheights is 1 (the
// "Generated surface depth" setting), as on busy textures the guessed heights swim more than they add depth
exec "pbr/heights.cfg"

texreplace "jojo/sand01.png" [pbrslot dense_sand 360 0.004] // 4m
texreplace "philipk/pk02/sand01_c.png" [pbrslot red_laterite_soil_stones 272 0.01] // 3m
texreplace "misc/agf81/concrete1_diffuse.png" [pbrslot concrete_floor_worn_001 272 0.006] // 3m
texreplace "misc/agf81/concrete1w_diffuse.png" [pbrslot plastered_wall 272 0.006] // 3m
texreplace "nobiax/textures/79/diffuse.png" [pbrslot concrete_wall_006 272 0.008] // 3m
texreplace "luckystrike/asphalt_01.jpg" [pbrslot asphalt_02 360 0.008] // 4m
texreplace "luckystrike/paris_wall_b.jpg" [pbrslot concrete_block_wall 181 0.015] // 2m, its blocks at their real size
texreplace "philipk/pk02/rock01_c.png" [pbrslot rock_face_04 450 0.025] // 5m

// trak's dark sheet metal: one scratched steel, raised to the brightness of plain steel for the brightest variant and the others
// as much darker as they were, since metal lit only by what it reflects looks darker than paint of the same colour; the dimpled
// ones have their layout rebuilt
texreplace "trak/trak5/base1a.jpg" [pbrslot Metal038 512 0.004 "<mad:1.19>"] // 2.8m at the maps' usual half scale
texreplace "trak/trak5/base1b.jpg" [pbrslot Metal038 512 0.004 "<mad:0.81>"]
texreplace "trak/trak5/base1c.jpg" [pbrslot Metal038 512 0.004 "<mad:1.4>"]
texreplace "trak/trak5/holes1a.jpg" [pbrslot Metal038_holes 512 0.008 "<mad:1.19>"]
texreplace "trak/trak5/holes1b.jpg" [pbrslot Metal038_holes 512 0.008 "<mad:1.04>"]
